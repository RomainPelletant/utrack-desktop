name: Nightly

# Builds every commit on master once CI has passed (merged PRs) and replaces
# the "nightly" pre-release with the new packages.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer merge supersedes the build in progress.
concurrency:
  group: nightly
  cancel-in-progress: true

env:
  # Keep in sync with ci.yml and release.yml.
  FLUTTER_VERSION: 3.47.7
  NIGHTLY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:

  prepare:
    name: Prepare nightly
    # Only pushes to master, not PRs from a fork branch named master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_SHA }}

      # 1.0.2-nightly.42.abc1234, shown in the app (About panel, .exe
      # properties) and in the file names. Sorts after 1.0.2 for dpkg.
      - name: Nightly version
        id: version
        run: |
          echo "version=$(scripts/release.sh version)-nightly.${GITHUB_RUN_NUMBER}.${NIGHTLY_SHA::7}" \
            >> "$GITHUB_OUTPUT"

  # ── macOS → signed & notarized universal .dmg ───────────────────────────────
  build-macos:
    needs: prepare
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_SHA }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12

          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm certificate.p12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k temp123 build.keychain

      - name: Build, sign and notarize
        env:
          UTD_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_SIGN_ID_APP: ${{ secrets.APPLE_SIGN_ID_APP }}
          APPLE_ACCOUNT_ID: ${{ secrets.APPLE_ACCOUNT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/release.sh macos

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 3

  # ── Linux → .tar.gz + .deb (amd64 + arm64) ───────────────────────────────────
  build-linux:
    needs: prepare
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # WPE WebKit >= 2.50 (flutter_inappwebview_linux) is not packaged on
    # Ubuntu runners; Debian testing ships it.
    container: debian:testing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            git curl unzip xz-utils zip ca-certificates \
            clang lld llvm cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libepoxy-dev \
            libwpe-1.0-dev libwpewebkit-2.0-dev libwpebackend-fdo-1.0-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_SHA }}

      - name: Setup Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter precache & config
        run: |
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux

      - name: Build and package
        env:
          UTD_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release.sh linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.deb
          if-no-files-found: error
          retention-days: 3

  # ── Linux → .flatpak (amd64 + arm64), WPE WebKit included ───────────────────
  build-flatpak:
    needs: prepare
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The first build compiles WPE WebKit (1–2 h).
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # Ubuntu 24.04 blocks the user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_SHA }}

      # Caches saved on master are also restored by release tags, so the
      # nightly keeps WPE WebKit warm for releases.
      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('linux/flatpak/*.yml') }}-${{ env.NIGHTLY_SHA }}
          restore-keys: flatpak-${{ matrix.arch }}-${{ hashFiles('linux/flatpak/*.yml') }}-

      - name: Build and package
        env:
          UTD_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release.sh flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: release/*.flatpak
          if-no-files-found: error
          retention-days: 3

  # ── Windows → .zip + installer ───────────────────────────────────────────────
  build-windows:
    needs: prepare
    name: Build Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_SHA }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build and package
        env:
          UTD_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release.sh windows

      - name: Upload zip and installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 3

  # ── "nightly" pre-release, replaced on every build ───────────────────────────
  publish:
    needs: [prepare, build-macos, build-linux, build-flatpak, build-windows]
    name: Publish nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_SHA }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes
        run: |
          {
            cat <<EOF
          Development build of \`${NIGHTLY_SHA::7}\` (${{ needs.prepare.outputs.version }}),
          rebuilt on every merge to master. **Not a stable release**: use it to test
          fixes before they ship.

          EOF
            # Empty [Unreleased] section: no notes.
            scripts/release.sh notes Unreleased 2>/dev/null || true
          } > release-notes.md
          cat release-notes.md

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --target "$NIGHTLY_SHA" \
            --title "UTD nightly (${NIGHTLY_SHA::7})" \
            --notes-file release-notes.md \
            --prerelease --latest=false \
            artifacts/*.dmg artifacts/*.zip artifacts/*.exe \
            artifacts/*.deb artifacts/*.tar.gz artifacts/*.flatpak
